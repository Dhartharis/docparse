<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc"><title id="title">DocParse — speaking chatbot</title><desc id="desc">A friendly robot moves its mouth while lines appear in its speech bubble.</desc><style>.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}.document{animation:document 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.line{stroke:#fff0ae;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:read 5s ease-in-out infinite}.second{animation-delay:.3s}.bubble{animation:glow 5s ease-in-out infinite}@keyframes blink{0%,12%,18%,100%{transform:scaleY(1)}15%{transform:scaleY(.12)}}@keyframes document{0%,12%,90%,100%{transform:translateY(3px);opacity:.72}30%,70%{transform:translateY(0);opacity:1}}@keyframes read{0%,30%{stroke-dashoffset:1;opacity:0}38%{opacity:1}58%,68%{stroke-dashoffset:0;opacity:1}85%,100%{stroke-dashoffset:0;opacity:0}}@keyframes glow{0%,20%,90%,100%{filter:none}40%,65%{filter:drop-shadow(0 0 3px #ffd339)}}@media(prefers-reduced-motion:reduce){.eye,.document,.line,.bubble{animation:none}.document{opacity:1}.line{opacity:0}}
.speech-line{stroke-dasharray:1;stroke-dashoffset:0;animation:speech 5s ease-in-out infinite}.line-two{animation-delay:.45s}.line-three{animation-delay:.9s}
@keyframes speech{0%,10%{stroke-dashoffset:1;opacity:0}16%{opacity:1}30%,72%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:0;opacity:0}}
.mouth-speaking{transform-box:fill-box;transform-origin:center;animation:talk 5s linear infinite}.mouth-smile{animation:rest 5s linear infinite}
@keyframes talk{0%,9%,65%,100%{opacity:0;transform:scaleY(.1)}10%{opacity:1;transform:scaleY(.2)}15%,27%,39%,51%{opacity:1;transform:scaleY(1)}21%,33%,45%,57%{opacity:1;transform:scaleY(.25)}63%{opacity:1;transform:scaleY(.7)}}
@keyframes rest{0%,9%,65%,100%{opacity:1}10%,64%{opacity:0}}
@media(prefers-reduced-motion:reduce){.speech-line,.mouth-speaking,.mouth-smile{animation:none}.speech-line{stroke-dashoffset:0;opacity:1}.mouth-speaking{display:none}.mouth-smile{opacity:1}}
</style>
