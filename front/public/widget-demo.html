<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocParse</title><style>body{margin:0;background:#08070b;color:#f6f5f7;font-family:Segoe UI,Arial,sans-serif;min-height:100dvh;display:grid;place-items:center}main{padding:36px;border:1px solid #ffffff20;border-radius:20px}h1{font-size:40px;font-weight:400;letter-spacing:-2px}img{width:64px}</style></head><body><main><img src="/assets/docparse-mark.svg" alt=""><h1>DocParse</h1></main><script>const bot=new URLSearchParams(location.hash.slice(1)).get('bot');if(bot&&/^[0-9a-f-]{36}$/i.test(bot)){const script=document.createElement('script');script.src='/api/embed/'+bot+'/loader.js';document.body.append(script);}</script></body></html>
